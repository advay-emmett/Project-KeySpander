name: key_spander
description: "A new Flutter project for Project KeySpander"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  window_manager: ^0.5.2
  flutter_riverpod: any
  path_provider: any
  flutter_launcher_icons: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256


  assets:
    - assets/keyspander_backend.exe
